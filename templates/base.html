<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{description}}" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="{{base}}/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="{{base}}/">Stock Homes</a>
        <nav>
          <a href="{{base}}/reports.json">資料 JSON</a>
          <a href="https://github.com/jeffoodchain/stockhomes">GitHub</a>
        </nav>
      </header>
      <main>{{content}}</main>
    </div>
    <script>
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));

      const searchInput = document.querySelector('[data-report-search]');
      if (searchInput) {
        const cards = [...document.querySelectorAll('[data-search]')];
        const sections = [...document.querySelectorAll('.category')];
        const noResults = document.querySelector('[data-no-results]');
        const listToggle = document.querySelector('[data-list-toggle]');
        const hitList = document.querySelector('[data-hit-list]');
        const currentQuery = () => searchInput.value.trim();

        // 逐條命中（KWIC）：依報告分組，同一篇多次提到分行列出，點該行跳到第 n 次出現。
        const renderHitList = (query) => {
          const needle = query.toLowerCase().replace(/\s+/g, ' ').trim();
          if (!needle) { hitList.innerHTML = ''; return; }
          const groups = [];
          let total = 0;
          for (const card of cards) {
            if (card.closest('[data-category-overview]')) continue;
            const body = card.dataset.body || '';
            if (!body) continue;
            const hay = body.toLowerCase();
            const url = card.dataset.url;
            const sep = url.includes('?') ? '&' : '?';
            const qs = sep + 'q=' + encodeURIComponent(query);
            let from = 0, n = 0, idx;
            const lines = [];
            while ((idx = hay.indexOf(needle, from)) !== -1) {
              const start = Math.max(0, idx - 36);
              const end = Math.min(body.length, idx + needle.length + 56);
              const before = (start > 0 ? '…' : '') + body.slice(start, idx);
              const hit = body.slice(idx, idx + needle.length);
              const after = body.slice(idx + needle.length, end) + (end < body.length ? '…' : '');
              lines.push('<a class="hit-line" href="' + url + qs + '&n=' + n + '">' +
                '<span class="hit-idx">' + (n + 1) + '</span>' +
                '<span class="hit-text">' + escapeHtml(before) + '<mark>' + escapeHtml(hit) + '</mark>' + escapeHtml(after) + '</span></a>');
              n += 1; from = idx + needle.length;
            }
            if (n === 0) continue;
            total += n;
            groups.push('<section class="hit-group"><h3 class="hit-group-title">' +
              '<a href="' + url + qs + '&n=0">' + escapeHtml(card.dataset.title) + '</a>' +
              '<span class="hit-group-count">' + n + ' 次</span></h3>' + lines.join('') + '</section>');
          }
          hitList.innerHTML = groups.length
            ? '<p class="hit-summary">' + total + ' 個命中 · ' + groups.length + ' 篇</p>' + groups.join('')
            : '<p class="empty">找不到任何命中。逐條模式比對的是整句出現的關鍵字。</p>';
        };

        const applySearch = () => {
          const query = currentQuery();
          const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
          const isSearching = terms.length > 0;
          const listMode = !!(listToggle && listToggle.checked);

          if (hitList) hitList.hidden = !(listMode && isSearching);
          document.body.classList.toggle('list-search-active', listMode && isSearching);
          if (listMode && isSearching) {
            renderHitList(query);
            if (noResults) noResults.hidden = true;
            return;
          }

          let visibleCount = 0;
          document.querySelectorAll('[data-category-overview]').forEach((node) => { node.hidden = isSearching; });
          document.querySelectorAll('[data-search-expanded]').forEach((node) => { node.hidden = !isSearching; });
          for (const card of cards) {
            const haystack = (card.dataset.search + ' ' + (card.dataset.body || '')).toLowerCase();
            const matched = terms.every((term) => haystack.includes(term));
            card.hidden = isSearching && !matched;
            if (!card.hidden && !card.closest('[data-category-overview]')) visibleCount += 1;
          }
          for (const section of sections) {
            section.hidden = isSearching && !section.querySelector('[data-search]:not([hidden])');
          }
          if (noResults) noResults.hidden = !isSearching || visibleCount > 0;
        };

        searchInput.addEventListener('input', applySearch);
        if (listToggle) listToggle.addEventListener('change', applySearch);
        document.addEventListener('click', (event) => {
          const link = event.target.closest('.card-title');
          const query = currentQuery();
          if (!link || !query || !link.closest('[data-search]')) return;
          const url = new URL(link.href);
          url.searchParams.set('q', query);
          link.href = url.toString();
        });
      }

      const reportParams = new URLSearchParams(window.location.search);
      const reportQuery = reportParams.get('q');
      const content = document.querySelector('.content');
      if (reportQuery && content) {
        const needle = reportQuery.trim().replace(/\s+/g, ' ').toLowerCase();
        const hitIndex = parseInt(reportParams.get('n'), 10);
        const marks = [];
        if (needle) {
          const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
              if (!node.nodeValue.trim() || node.parentElement.closest('script, style, code, pre, mark')) {
                return NodeFilter.FILTER_REJECT;
              }
              return NodeFilter.FILTER_ACCEPT;
            },
          });
          const textNodes = [];
          for (let tn = walker.nextNode(); tn; tn = walker.nextNode()) textNodes.push(tn);
          for (const node of textNodes) {
            const text = node.nodeValue;
            const lower = text.toLowerCase();
            const starts = [];
            let from = 0, idx;
            while ((idx = lower.indexOf(needle, from)) !== -1) { starts.push(idx); from = idx + needle.length; }
            if (!starts.length) continue;
            const frag = document.createDocumentFragment();
            let cursor = 0;
            for (const start of starts) {
              if (start > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, start)));
              const mark = document.createElement('mark');
              mark.className = 'search-hit';
              mark.textContent = text.slice(start, start + needle.length);
              frag.appendChild(mark);
              marks.push(mark);
              cursor = start + needle.length;
            }
            if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
            node.parentNode.replaceChild(frag, node);
          }
        }
        const target = marks[Number.isInteger(hitIndex) && hitIndex >= 0 && hitIndex < marks.length ? hitIndex : 0];
        if (target) {
          target.classList.add('search-hit-active');
          target.scrollIntoView({ block: 'center' });
        }
      }
    </script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>
  </body>
</html>
