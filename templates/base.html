<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{description}}" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="{{base}}/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="{{base}}/">Stock Homes</a>
        <nav>
          <a href="{{base}}/reports.json">資料 JSON</a>
          <a href="https://github.com/jeffoodchain/stockhomes">GitHub</a>
        </nav>
      </header>
      <main>{{content}}</main>
    </div>
    <script>
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));

      const searchInput = document.querySelector('[data-report-search]');
      if (searchInput) {
        const cards = [...document.querySelectorAll('[data-search]')];
        const sections = [...document.querySelectorAll('.category')];
        const noResults = document.querySelector('[data-no-results]');
        const hitList = document.querySelector('[data-hit-list]');
        let searchIndexPromise = null;
        let debounceTimer = null;

        const currentQuery = () => searchInput.value.trim();
        const searchIndexUrl = () => searchInput.dataset.searchIndex || './search-index.json';

        const loadSearchIndex = async () => {
          if (!searchIndexPromise) {
            if (hitList) hitList.innerHTML = '<p class="empty">載入搜尋索引中…</p>';
            searchIndexPromise = fetch(searchIndexUrl()).then((res) => {
              if (!res.ok) throw new Error('Search index HTTP ' + res.status);
              return res.json();
            });
          }
          return searchIndexPromise;
        };

        const makeSnippet = (body, idx, len) => {
          const start = Math.max(0, idx - 48);
          const end = Math.min(body.length, idx + len + 72);
          return {
            before: (start > 0 ? '…' : '') + body.slice(start, idx),
            hit: body.slice(idx, idx + len),
            after: body.slice(idx + len, end) + (end < body.length ? '…' : ''),
          };
        };

        const renderHitList = async (query) => {
          const normalized = query.toLowerCase().replace(/\s+/g, ' ').trim();
          const terms = normalized.split(/\s+/).filter(Boolean);
          if (!terms.length || !hitList) { if (hitList) hitList.innerHTML = ''; return; }

          let index;
          try {
            index = await loadSearchIndex();
          } catch (err) {
            hitList.innerHTML = '<p class="empty">搜尋索引載入失敗：' + escapeHtml(err.message) + '</p>';
            return;
          }

          const rows = [];
          let reportCount = 0;
          const maxRows = 1500;
          for (const report of index) {
            const body = report.bodyText || '';
            const hay = [report.title, report.excerpt, report.category, report.categoryTitle, ...(report.tags || []), ...(report.keywords || []), ...(report.aliases || []), body].join(' ').toLowerCase();
            if (!terms.every((term) => hay.includes(term))) continue;
            reportCount += 1;

            let matches = [];
            for (const term of terms) {
              const bodyHay = body.toLowerCase();
              let from = 0, idx;
              while ((idx = bodyHay.indexOf(term, from)) !== -1) {
                matches.push({ idx, term });
                from = idx + Math.max(1, term.length);
                if (matches.length >= 30) break;
              }
            }
            matches.sort((a, b) => a.idx - b.idx);
            if (!matches.length) matches = [{ idx: 0, term: '' }];

            let n = 0;
            for (const match of matches) {
              if (rows.length >= maxRows) break;
              const idx = match.idx || 0;
              const term = match.term || terms[0];
              const snippet = term ? makeSnippet(body, idx, term.length) : { before: '', hit: report.excerpt || report.title, after: '' };
              const url = report.url.startsWith('/') ? report.url : '/' + report.url;
              const sep = url.includes('?') ? '&' : '?';
              const href = url + sep + 'q=' + encodeURIComponent(term || query) + '&n=' + n;
              rows.push('<a class="hit-row" href="' + href + '">' +
                '<span class="hit-source">' + escapeHtml(report.title) + ' · 第 ' + (n + 1) + ' 次</span>' +
                '<span class="hit-snippet">' + escapeHtml(snippet.before) + '<mark>' + escapeHtml(snippet.hit) + '</mark>' + escapeHtml(snippet.after) + '</span>' +
              '</a>');
              n += 1;
            }
            if (rows.length >= maxRows) break;
          }

          hitList.innerHTML = rows.length
            ? '<p class="hit-count">' + rows.length + ' 個命中，分布於 ' + reportCount + ' 篇' + (rows.length >= maxRows ? '（已截斷，請縮小關鍵字）' : '') + '</p>' + rows.join('')
            : '<p class="empty">找不到任何命中。多個關鍵字會以 AND 搜尋，試試較短的公司名、股票代號、中文或英文關鍵字。</p>';
        };

        const resetBrowse = () => {
          for (const card of cards) card.hidden = false;
          for (const section of sections) section.hidden = false;
          if (noResults) noResults.hidden = true;
          if (hitList) { hitList.hidden = true; hitList.innerHTML = ''; }
          document.body.classList.remove('list-search-active');
        };

        const applySearch = () => {
          const query = currentQuery();
          const isSearching = query.length > 0;
          if (!isSearching) { resetBrowse(); return; }
          if (hitList) hitList.hidden = false;
          if (noResults) noResults.hidden = true;
          document.body.classList.add('list-search-active');
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => renderHitList(query), 180);
        };

        searchInput.addEventListener('input', applySearch);
      }

      const reportParams = new URLSearchParams(window.location.search);
      const reportQuery = reportParams.get('q');
      const content = document.querySelector('.content');

      const podcastPlayer = document.querySelector('[data-podcast-player]');
      if (podcastPlayer) {
        const audio = podcastPlayer.querySelector('audio');
        const buttons = [...document.querySelectorAll('[data-podcast-play]')];
        let stopAt = null;

        const playSegment = (button) => {
          if (!audio) return;
          const start = Number(button.dataset.start || 0);
          const end = Number(button.dataset.end || 0);
          stopAt = Number.isFinite(end) && end > start ? end : null;
          audio.currentTime = Math.max(0, start);
          audio.play().catch(() => {});
          for (const btn of buttons) btn.classList.toggle('podcast-play-active', btn === button);
          if (button.dataset.segmentId) {
            history.replaceState(null, '', '#' + encodeURIComponent(button.dataset.segmentId));
          }
        };

        for (const button of buttons) {
          button.addEventListener('click', () => playSegment(button));
        }

        if (audio) {
          audio.addEventListener('timeupdate', () => {
            if (stopAt !== null && audio.currentTime >= stopAt) {
              audio.pause();
              stopAt = null;
            }
          });
        }

        const hashId = decodeURIComponent(window.location.hash.replace(/^#/, ''));
        if (hashId) {
          const target = document.getElementById(hashId);
          const button = target?.querySelector('[data-podcast-play]');
          if (target) target.scrollIntoView({ block: 'center' });
          if (button) button.classList.add('podcast-play-active');
        }
      }

      if (reportQuery && content) {
        const needle = reportQuery.trim().replace(/\s+/g, ' ').toLowerCase();
        const hitIndex = parseInt(reportParams.get('n'), 10);
        const marks = [];
        if (needle) {
          const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
              if (!node.nodeValue.trim() || node.parentElement.closest('script, style, code, pre, mark')) {
                return NodeFilter.FILTER_REJECT;
              }
              return NodeFilter.FILTER_ACCEPT;
            },
          });
          const textNodes = [];
          for (let tn = walker.nextNode(); tn; tn = walker.nextNode()) textNodes.push(tn);
          for (const node of textNodes) {
            const text = node.nodeValue;
            const lower = text.toLowerCase();
            const starts = [];
            let from = 0, idx;
            while ((idx = lower.indexOf(needle, from)) !== -1) { starts.push(idx); from = idx + needle.length; }
            if (!starts.length) continue;
            const frag = document.createDocumentFragment();
            let cursor = 0;
            for (const start of starts) {
              if (start > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, start)));
              const mark = document.createElement('mark');
              mark.className = 'search-hit';
              mark.textContent = text.slice(start, start + needle.length);
              frag.appendChild(mark);
              marks.push(mark);
              cursor = start + needle.length;
            }
            if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
            node.parentNode.replaceChild(frag, node);
          }
        }
        const target = marks[Number.isInteger(hitIndex) && hitIndex >= 0 && hitIndex < marks.length ? hitIndex : 0];
        if (target) {
          target.classList.add('search-hit-active');
          target.scrollIntoView({ block: 'center' });
        }
      }
    </script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>
  </body>
</html>
