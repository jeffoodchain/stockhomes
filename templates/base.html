<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{description}}" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="{{base}}/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="{{base}}/">Stock Homes</a>
        <nav>
          <a href="{{base}}/reports.json">資料 JSON</a>
          <a href="https://github.com/jeffoodchain/stockhomes">GitHub</a>
        </nav>
      </header>
      <main>{{content}}</main>
    </div>
    <script>
      const searchInput = document.querySelector('[data-report-search]');
      if (searchInput) {
        const cards = [...document.querySelectorAll('[data-search]')];
        const sections = [...document.querySelectorAll('.category')];
        const noResults = document.querySelector('[data-no-results]');
        const currentQuery = () => searchInput.value.trim();
        searchInput.addEventListener('input', () => {
          const terms = currentQuery().toLowerCase().split(/\s+/).filter(Boolean);
          const isSearching = terms.length > 0;
          let visibleCount = 0;
          document.querySelectorAll('[data-category-overview]').forEach((node) => { node.hidden = isSearching; });
          document.querySelectorAll('[data-search-expanded]').forEach((node) => { node.hidden = !isSearching; });
          for (const card of cards) {
            const haystack = card.dataset.search.toLowerCase();
            const matched = terms.every((term) => haystack.includes(term));
            card.hidden = isSearching && !matched;
            if (!card.hidden && !card.closest('[data-category-overview]')) visibleCount += 1;
          }
          for (const section of sections) {
            section.hidden = isSearching && !section.querySelector('[data-search]:not([hidden])');
          }
          if (noResults) noResults.hidden = !isSearching || visibleCount > 0;
        });
        document.addEventListener('click', (event) => {
          const link = event.target.closest('.card-title');
          const query = currentQuery();
          if (!link || !query || !link.closest('[data-search]')) return;
          const url = new URL(link.href);
          url.searchParams.set('q', query);
          link.href = url.toString();
        });
      }

      const reportQuery = new URLSearchParams(window.location.search).get('q');
      const content = document.querySelector('.content');
      if (reportQuery && content) {
        const terms = [reportQuery.trim(), ...reportQuery.trim().split(/\s+/)].filter(Boolean);
        const escaped = terms
          .sort((a, b) => b.length - a.length)
          .map((term) => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
        const pattern = escaped.length ? new RegExp(escaped.join('|'), 'i') : null;
        const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.nodeValue.trim() || node.parentElement.closest('script, style, code, pre, mark')) {
              return NodeFilter.FILTER_REJECT;
            }
            return pattern && pattern.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
          },
        });
        const textNode = walker.nextNode();
        if (textNode) {
          const match = textNode.nodeValue.match(pattern);
          const range = document.createRange();
          range.setStart(textNode, match.index);
          range.setEnd(textNode, match.index + match[0].length);
          const mark = document.createElement('mark');
          mark.className = 'search-hit';
          range.surroundContents(mark);
          mark.scrollIntoView({ block: 'center' });
        }
      }
    </script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>
  </body>
</html>
