<section class="hero">
  <h1>股票 / 產業研究</h1>
  <p class="stat">共 {{count}} 篇報告</p>
</section>
<section class="search-panel" aria-label="搜尋報告">
  <label for="report-search">搜尋報告</label>
  <input id="report-search" data-report-search type="search" placeholder="輸入股票、公司、主題或關鍵字，例如 仁寶、Rubin、AI 伺服器、MLCC" />
  <p>搜尋會比對標題、摘要、分類、標籤、keywords / aliases 與文章內文，不只看 tag。</p>
  <label class="hit-toggle">
    <input type="checkbox" data-list-toggle />
    <span class="hit-toggle-pill"><span class="hit-toggle-dot"></span>逐條列出命中</span>
  </label>
  <p class="hit-toggle-hint">打開後，同一篇多次提到的關鍵字會分行列出。</p>
</section>
<section class="browse-panel" aria-label="瀏覽入口">
  <div>
    <h2>分類瀏覽</h2>
    <div class="taxonomy-links">{{categories}}</div>
  </div>
  <div>
    <h2>熱門主題</h2>
    <div class="topic-cloud">{{topics}}</div>
  </div>
</section>
<p class="empty" data-no-results hidden>找不到符合的報告，試試較短的公司名、股票代號、中文或英文關鍵字。</p>
<div class="hit-list" data-hit-list hidden></div>
{{reports}}
