<article class="report">
  <header class="report-header">
    <p class="eyebrow">{{category}}</p>
    <h1>{{title}}</h1>
    <div class="report-meta">
      <span>{{date}}</span>
      <span>Local: <code>{{sourcePath}}</code></span>
      {{hackmd}}
    </div>
    <div class="tags">{{tags}}</div>
  </header>
  <section class="content">
    {{content}}
  </section>
</article>
