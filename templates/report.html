<article class="report">
  <header class="report-header">
    <p class="eyebrow">{{category}}</p>
    <h1>{{title}}</h1>
    <div class="report-meta">
      <span>{{date}}</span>
      <span>本機：<code>{{sourcePath}}</code></span>
      {{hackmd}}
    </div>
  </header>
  <section class="content">
    {{content}}
  </section>
  <footer class="report-footer">
    <h2>標籤</h2>
    <div class="tags">{{tags}}</div>
  </footer>
</article>
